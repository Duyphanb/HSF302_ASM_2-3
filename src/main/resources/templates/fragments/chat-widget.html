<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="chatWidget"
     id="ai-chat-widget"
     data-endpoint="/api/chat"
     data-status-endpoint="/api/chat/status"
     th:attr="data-endpoint=@{/api/chat}, data-status-endpoint=@{/api/chat/status}">

    <button id="chat-toggle"
            type="button"
            class="btn btn-danger rounded-circle shadow-lg"
            aria-label="Mở trợ lý AI"
            aria-expanded="false"
            style="
                width: 60px;
                height: 60px;
                position: fixed;
                right: 24px;
                bottom: 24px;
                z-index: 1050;
                font-size: 24px;
            ">
        💬
    </button>

    <section id="chat-panel"
             role="dialog"
             aria-label="Trợ lý món nướng"
             class="card border-0 shadow-lg"
             aria-hidden="true"
             style="
                display: none;
                width: 360px;
                max-width: calc(100vw - 32px);
                height: 500px;
                max-height: calc(100vh - 120px);
                position: fixed;
                right: 24px;
                bottom: 96px;
                z-index: 1050;
                overflow: hidden;
             ">

        <header class="card-header bg-danger text-white d-flex
                       justify-content-between align-items-center">
            <div>
                <strong>🤖 Trợ lý món nướng</strong>
                <div style="font-size: 12px; opacity: 0.9;">
                    Hỏi về món ăn, giá và danh mục
                </div>
            </div>

            <div class="d-flex align-items-center gap-2">
                <span id="chat-availability"
                      class="badge bg-light text-danger"
                      hidden>
                    AI bảo trì
                </span>
                <button id="chat-clear"
                        type="button"
                        class="btn btn-sm btn-outline-light"
                        aria-label="Xóa cuộc trò chuyện">
                    Xóa
                </button>
                <button id="chat-close"
                        type="button"
                        class="btn-close btn-close-white"
                        aria-label="Đóng Chatbox">
                </button>
            </div>
        </header>

        <div id="chat-messages"
             class="card-body bg-light overflow-auto"
             aria-live="polite"
             aria-busy="false"
             style="
                 flex: 1;
                 min-height: 0;
             ">
            <div class="mb-3 text-start">
                <span class="d-inline-block bg-white border rounded-3 p-2 text-break">
                    Xin chào! Tôi có thể giúp bạn tìm món nướng phù hợp.
                </span>
            </div>
        </div>

        <footer class="card-footer bg-white">
            <div id="chat-suggestions"
                 class="d-flex flex-wrap gap-2 mb-2"
                 aria-label="Câu hỏi gợi ý">
                <button type="button"
                        class="btn btn-sm btn-outline-danger text-start"
                        data-chat-suggestion="Có những món nào trong thực đơn?">
                    Xem các món đang có
                </button>
                <button type="button"
                        class="btn btn-sm btn-outline-danger text-start"
                        data-chat-suggestion="Món nào có giá dưới 100.000 VNĐ?">
                    Món dưới 100.000 VNĐ
                </button>
                <button type="button"
                        class="btn btn-sm btn-outline-danger text-start"
                        data-chat-suggestion="Hãy gợi ý cho tôi một món hải sản.">
                    Gợi ý món hải sản
                </button>
            </div>

            <div class="input-group">
                <input id="chat-input"
                       type="text"
                       class="form-control"
                       maxlength="500"
                       autocomplete="off"
                       placeholder="Nhập câu hỏi...">

                <button id="chat-send"
                        type="button"
                        class="btn btn-danger">
                    Gửi
                </button>
            </div>

            <small id="chat-status"
                   class="d-block text-muted mt-1"
                   aria-live="polite">
            </small>
        </footer>
    </section>
</div>

</body>
</html>
