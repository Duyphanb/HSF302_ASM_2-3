<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 620px">
    <div class="card shadow border-0">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <div class="badge text-bg-primary mb-2">THANH TOÁN QR</div>
                <h2>Thanh toán đơn hàng</h2>
                <p class="text-muted mb-0">Quét mã QR để chuyển khoản đúng số tiền.</p>
            </div>

            <div class="row g-4 align-items-center mb-4">
                <div class="col-md-5 text-center">
                    <img th:if="${qrConfigured}" class="img-fluid border rounded p-2 bg-white" style="max-width:220px"
                         alt="QR thanh toán"
                         th:src="${qrUrl}">
                    <div th:if="${qrConfigured}"><small class="d-block text-muted mt-2">Nội dung: Thanh toán đơn hàng</small></div>
                    <div th:unless="${qrConfigured}" class="alert alert-warning small mb-0">Chưa cấu hình tài khoản nhận tiền để hiển thị QR.</div>
                </div>
                <div class="col-md-7 bg-light rounded p-3">
                <div class="d-flex justify-content-between">
                    <span>Mã đơn hàng</span>
                    <strong th:text="${payment.order.id}"></strong>
                </div>
                <div class="d-flex justify-content-between">
                    <span>Sản phẩm</span>
                    <strong th:text="${#lists.size(payment.order.items) + ' món'}"></strong>
                </div>
                <div class="small text-muted mt-2" th:each="item : ${payment.order.items}">
                    <span th:text="${item.food.name + ' × ' + item.quantity}"></span>
                </div>
                <hr>
                <div class="d-flex justify-content-between fs-5">
                    <span>Tổng tiền</span>
                    <strong class="text-danger" th:text="${payment.amount} + ' VNĐ'"></strong>
                </div>
                </div>
            </div>

            <form method="post" th:action="@{/payment/{id}/process(id=${payment.order.id})}">
                <button class="btn btn-success w-100 mb-2" name="action" value="success" type="submit">
                    Tôi đã thanh toán
                </button>
                <button class="btn btn-danger w-100 mb-2" name="action" value="failed" type="submit">
                    Thanh toán thất bại
                </button>
                <button class="btn btn-outline-secondary w-100" name="action" value="cancel" type="submit">
                    Hủy giao dịch
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
