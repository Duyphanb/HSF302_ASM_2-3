<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết quả thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 560px">
    <div class="card shadow border-0 text-center">
        <div class="card-body p-5">
            <div th:if="${payment.status.name() == 'SUCCESS'}">
                <div class="display-3">✅</div>
                <h2 class="text-success">Thanh toán thành công</h2>
            </div>
            <div th:if="${payment.status.name() == 'FAILED'}">
                <div class="display-3">❌</div>
                <h2 class="text-danger">Thanh toán thất bại</h2>
            </div>
            <div th:if="${payment.status.name() == 'CANCELLED'}">
                <div class="display-3">⚠️</div>
                <h2 class="text-warning">Đã hủy giao dịch</h2>
            </div>
            <p class="mt-3 mb-1">Mã đơn hàng: <strong th:text="${payment.order.id}"></strong></p>
            <p>Mã giao dịch: <strong th:text="${payment.transactionCode}"></strong></p>
            <a class="btn btn-primary mt-3" th:href="@{/food/donuong}">Quay lại menu</a>
        </div>
    </div>
</div>
</body>
</html>
