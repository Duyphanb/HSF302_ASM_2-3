<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Xác nhận đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 800px">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Xác nhận đơn hàng</h2>
        <a class="btn btn-outline-secondary" th:href="@{/cart}">← Giỏ hàng</a>
    </div>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <p class="text-muted">Kiểm tra đơn hàng trước khi thanh toán bằng QR.</p>
            <div class="alert alert-info">Phương thức: <strong>Chuyển khoản qua QR</strong></div>
            <form method="post" th:action="@{/checkout}">
                <button class="btn btn-primary w-100" type="submit">Tạo đơn và thanh toán</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
