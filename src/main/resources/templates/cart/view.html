<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Giỏ hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/food/donuong}">🔥 Food Shop</a><a class="btn btn-outline-light btn-sm" th:href="@{/features}">Tính năng</a></div></nav>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4"><h2 class="fw-bold">🛒 Giỏ hàng</h2><a class="btn btn-outline-primary" th:href="@{/food/donuong}">Tiếp tục chọn món</a></div>
    <div th:if="${#lists.isEmpty(cartLines)}" class="alert alert-warning text-center">Giỏ hàng đang trống.</div>
    <div th:unless="${#lists.isEmpty(cartLines)}" class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0">
                <thead class="table-dark"><tr><th>Món</th><th>Đơn giá</th><th style="width:180px">Số lượng</th><th>Thành tiền</th><th></th></tr></thead>
                <tbody><tr th:each="line : ${cartLines}">
                    <td><div class="fw-bold" th:text="${line.food.name}"></div><small class="text-muted" th:text="${line.food.description}"></small></td>
                    <td th:text="${line.food.price} + ' VNĐ'"></td>
                    <td><form class="d-flex" method="post" th:action="@{/cart/update}"><input type="hidden" name="foodId" th:value="${line.food.id}"><input class="form-control form-control-sm me-2" type="number" name="quantity" min="1" th:value="${line.quantity}"><button class="btn btn-outline-primary btn-sm">✓</button></form></td>
                    <td class="fw-bold text-danger" th:text="${line.subtotal} + ' VNĐ'"></td>
                    <td><form method="post" th:action="@{/cart/remove}"><input type="hidden" name="foodId" th:value="${line.food.id}"><button class="btn btn-outline-danger btn-sm">Xóa</button></form></td>
                </tr></tbody>
            </table></div></div>
            <form class="mt-3" method="post" th:action="@{/cart/clear}"><button class="btn btn-outline-secondary btn-sm">Xóa toàn bộ giỏ</button></form>
        </div>
        <div class="col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body"><h5>Tóm tắt</h5><div class="d-flex justify-content-between my-3"><span>Tổng cộng</span><strong class="text-danger" th:text="${cartTotal} + ' VNĐ'"></strong></div><a class="btn btn-success w-100" th:href="@{/checkout}">Thanh toán</a></div></div></div>
    </div>
</div>
</body>
</html>
