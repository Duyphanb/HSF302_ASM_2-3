<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menu Đồ Nướng</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container py-5">
    <h1 class="text-center mb-5">🍖 Menu Đồ Nướng</h1>

    <div class="card shadow border-0">
        <div class="card-body">
            <table class="table table-hover align-middle text-center">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <!-- Empty -->
                <tr th:if="${#lists.isEmpty(foodbags)}">
                    <td colspan="8" class="text-danger fw-bold">No records found!</td>
                </tr>

                <!-- Data -->
                <tr th:each="x : ${foodbags}">
                    <td th:text="${x.id}"></td>

                    <!-- IMAGE -->
                    <td>
                        <img th:if="${x.imageUrl != null}" th:src="${x.imageUrl}"
                             class="food-image" alt="food"
                             style="width:70px;height:70px;object-fit:cover;">
                        <span th:if="${x.imageUrl == null}" class="text-muted">No image</span>
                    </td>

                    <!-- NAME -->
                    <td class="fw-bold" th:text="${x.name}"></td>

                    <!-- DESCRIPTION -->
                    <td>
                        <div class="description-preview" th:utext="${x.description}"></div>
                    </td>

                    <!-- PRICE -->
                    <td>
                        <span class="badge bg-danger" th:text="${x.price} + ' VNĐ'"></span>
                    </td>

                    <!-- QUANTITY -->
                    <td>
                        <span class="badge bg-success" th:text="${x.quantity}"></span>
                    </td>

                    <!-- CATEGORY -->
                    <td>
                        <span class="badge bg-warning text-dark" th:text="${x.category.name}"></span>
                    </td>

                    <td>
                        <a class="btn btn-outline-dark btn-sm"
                           th:href="@{/food/donuong/{id}(id=${x.id})}">
                            View
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
