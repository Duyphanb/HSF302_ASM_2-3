<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Food Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Food Detail</h1>
        <a class="btn btn-outline-secondary" th:href="@{/food/donuong}">Back to Menu</a>
    </div>

    <div class="card shadow border-0 detail-card">
        <div class="row g-0">
            <div class="col-lg-5">
                <img th:if="${food.imageUrl != null}" th:src="${food.imageUrl}" class="detail-image" alt="food image">
                <div th:if="${food.imageUrl == null}" class="detail-image detail-image-placeholder">
                    No image
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card-body p-4 p-lg-5">
                    <span class="badge bg-warning text-dark mb-3" th:text="${food.category.name}"></span>
                    <h2 class="mb-3" th:text="${food.name}"></h2>

                    <div class="d-flex gap-3 flex-wrap mb-4">
                        <span class="badge bg-danger detail-badge" th:text="${food.price} + ' VND'"></span>
                        <span class="badge bg-success detail-badge" th:text="'Qty: ' + ${food.quantity}"></span>
                    </div>

                    <div class="richtext-card">
                        <div class="richtext-label">Rich text description</div>
                        <div class="richtext-output" th:utext="${food.description}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
