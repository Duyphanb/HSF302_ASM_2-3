spring.application.name=asm

# Tự động đọc file .env ở thư mục chạy ứng dụng như một file properties.
# File là optional để ứng dụng vẫn khởi động khi chưa có .env.
spring.config.import=optional:file:.env[.properties]

# Cấu hình SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=asm;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Cloudinary credentials
cloudinary.cloud-name=kkskswrh
cloudinary.api-key=567374157961243
cloudinary.api-secret=PeI3qhIviNgOu_dvCKVvwfwfITM

# =========================================================
# AI CHATBOX - GOOGLE GEMINI
# =========================================================

# Công tắc chung cho AI và RAG. Giá trị được đọc từ file .env.
app.ai.enabled=${AI_ENABLED:false}

# Khi AI bị tắt, giá trị mặc định là none để Spring AI
# không cố khởi tạo model.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}

# Gemini API key phải lấy từ biến môi trường.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}

# Có thể đổi model bằng biến môi trường GEMINI_MODEL.
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

# Temperature thấp để AI trả lời ổn định theo dữ liệu thực đơn.
spring.ai.google.genai.chat.temperature=0.1

# Không cho Gemini tự tìm kiếm Google.
spring.ai.google.genai.chat.google-search-retrieval=false

# =========================================================
# RAG - GEMINI EMBEDDING + VECTOR STORE TRONG BỘ NHỚ
# =========================================================

# Khi chưa bật AI, Spring không khởi tạo embedding model.
spring.ai.model.embedding.text=${SPRING_AI_MODEL_EMBEDDING:none}

# Dùng cùng Gemini API key cho embedding.
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:not-configured}

# Model embedding có free tier và hỗ trợ tiếng Việt.
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.task-type=SEMANTIC_SIMILARITY
